<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Page headline — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; padding: var(--space-8) var(--margin); }
  .note { font-size: 12px; color: var(--color-text-muted); margin: 0 0 var(--space-5); }
  .headline { padding: 64px 0 var(--section-lg); border-bottom: 1px solid var(--color-border-subtle); display: flex; flex-direction: column; gap: var(--space-4); }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; color: var(--color-text-muted); margin: 0; }
  h1 { max-width: 18ch; }
  .lead { color: var(--color-text-secondary); max-width: 60ch; margin: 0; }
</style>
</head>
<body>
  <p class="note">PitchYes · Topo das páginas internas (eyebrow = seção pai, H1 = nome da página). React: components/PageHeadline.tsx</p>
  <section class="headline">
    <p class="eyebrow">Soluções</p>
    <h1>Ligações ativas</h1>
    <p class="lead">Prospecção, qualificação de leads, confirmação de reuniões e follow-up com IA de voz.</p>
  </section>
</body>
</html>
