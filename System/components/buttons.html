<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Buttons — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
  .row { display: flex; gap: var(--space-3); align-items: center; flex-wrap: wrap; }
  .label { font-size: 12px; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: var(--space-2); }

  /* Base button reset — shared by every variant */
  .btn {
    font-family: var(--font-sans);
    font-size: var(--text-button-size);
    font-weight: var(--text-button-weight);
    line-height: 1;
    padding: 8px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: background var(--duration-fast) var(--ease), border-color var(--duration-fast) var(--ease), opacity var(--duration-fast) var(--ease);
    text-decoration: none;
    white-space: nowrap;
  }

  /* Ghost — e.g. "Log in" */
  .btn-ghost {
    color: var(--color-text);
    background: transparent;
    border-color: transparent;
  }
  .btn-ghost:hover { background: var(--color-border-subtle); }

  /* Outline — e.g. "Try for free" */
  .btn-outline {
    color: var(--color-text);
    background: transparent;
    border-color: var(--color-border-strong);
  }
  .btn-outline:hover { border-color: var(--color-text); }

  /* Solid accent — e.g. "Book a call" */
  .btn-solid {
    color: var(--color-accent-primary-contrast);
    background: var(--color-accent-primary-strong);
    border-color: var(--color-accent-primary-contrast);
  }
  .btn-solid:hover { opacity: .85; }

  /* Solid dark — e.g. footer CTA "Book a call" on cream background */
  .btn-dark {
    color: var(--color-text-inverse);
    background: var(--color-text);
    border-color: var(--color-text);
  }
  .btn-dark:hover { opacity: .85; }

  .btn-sizeLg { padding: 12px 20px; font-size: 15px; border-radius: 8px; }

  .btn[disabled] { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>
  <div>
    <div class="label">Ghost</div>
    <div class="row">
      <a class="btn btn-ghost" href="#">Log in</a>
    </div>
  </div>

  <div>
    <div class="label">Outline</div>
    <div class="row">
      <a class="btn btn-outline" href="#">Try for free</a>
    </div>
  </div>

  <div>
    <div class="label">Solid accent (violeta)</div>
    <div class="row">
      <a class="btn btn-solid" href="#">Book a call</a>
      <a class="btn btn-solid btn-sizeLg" href="#">Book a call →</a>
      <a class="btn btn-solid" href="#" disabled>Book a call</a>
    </div>
  </div>

  <div>
    <div class="label">Solid dark</div>
    <div class="row">
      <a class="btn btn-dark" href="#">Book a call →</a>
    </div>
  </div>
</body>
</html>
