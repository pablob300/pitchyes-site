<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Carousel / slider — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; padding: var(--space-8) var(--margin); }

  .carousel { position: relative; }
  .slide {
    background: var(--color-pastel-cream);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    display: grid;
    grid-template-columns: 1fr 1fr;
    min-height: 200px;
    overflow: hidden;
  }
  .slide-copy { padding: var(--space-6); display: flex; flex-direction: column; justify-content: center; gap: var(--space-3); }
  .slide-copy h3 { font-size: 22px; line-height: 1.15; }
  .slide-author { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--color-text-muted); }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--color-accent-primary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: white; }
  .slide-media { background: var(--color-pastel-gray); }

  .carousel-controls { display: flex; align-items: center; justify-content: space-between; margin-top: var(--space-4); }
  .progress { display: flex; gap: 6px; }
  .progress .seg { width: 40px; height: 3px; border-radius: 999px; background: var(--color-border); overflow: hidden; }
  .progress .seg.active { background: var(--color-text); }
  .arrows { display: flex; gap: 8px; }
  .arrow-btn {
    width: 32px; height: 32px; border-radius: 50%;
    border: 1px solid var(--color-border-strong);
    background: var(--color-bg);
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 14px;
  }
</style>
</head>
<body>
  <div class="carousel">
    <div class="slide">
      <div class="slide-copy">
        <h3>Bland is FedRAMP certified and ready to automate federal government phone calls</h3>
        <div class="slide-author">
          <span class="avatar">M</span>
          <span>Meg Zabrowski · Director of Product Marketing</span>
        </div>
      </div>
      <div class="slide-media"></div>
    </div>

    <div class="carousel-controls">
      <div class="progress">
        <div class="seg active"></div>
        <div class="seg"></div>
        <div class="seg"></div>
        <div class="seg"></div>
      </div>
      <div class="arrows">
        <button class="arrow-btn">←</button>
        <button class="arrow-btn">→</button>
      </div>
    </div>
  </div>
</body>
</html>
