<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Agent widget — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; padding: var(--space-8) var(--margin); }
  .note { font-size: 12px; color: var(--color-text-muted); margin: 0 0 var(--space-5); }
  .widget { max-width: 460px; background: var(--color-bg-inverse); color: var(--color-text-inverse); border-radius: var(--radius-lg); padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-5); box-shadow: var(--shadow-lg); }
  .eyebrow { font-size: 11px; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-inverse-muted); margin: 0; }
  .pills { display: flex; flex-wrap: wrap; gap: var(--space-2); }
  .pill { font-family: var(--font-sans); font-size: 13px; padding: 7px 14px; border-radius: var(--radius-pill); border: 1px solid var(--color-border-inverse-strong); background: transparent; color: var(--color-text-inverse); cursor: pointer; }
  .pill:hover { border-color: var(--color-text-inverse); }
  .pill[aria-checked="true"] { background: var(--color-text-inverse); border-color: var(--color-text-inverse); color: var(--color-text); }
  .stage { border: 1px dashed var(--color-border-inverse-strong); border-radius: var(--radius-md); background: var(--color-bg-inverse-elevated); min-height: 240px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--space-3); text-align: center; }
  .stage p { margin: 0; }
  .orb { width: 88px; height: 88px; border-radius: 50%; border: 0; background: radial-gradient(circle at 30% 30%, var(--color-accent-gold), var(--color-accent-burnt)); display: grid; place-items: center; position: relative; margin-bottom: var(--space-2); cursor: pointer; }
  .orb::after { content: ""; position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(249,169,0,.45); animation: pulse 2.4s var(--ease) infinite; }
  .core { width: 14px; height: 14px; border-radius: 50%; background: #fff; }
  .name { font-size: 15px; font-weight: 600; }
  .hint { font-size: 13px; color: var(--color-text-inverse-muted); }
  @keyframes pulse { 0% { transform: scale(.92); opacity: 1; } 100% { transform: scale(1.25); opacity: 0; } }
</style>
</head>
<body>
  <p class="note">PitchYes · Hero, bloco “Fale com um agente”. React: project/src/components/home/AgentWidget.tsx</p>
  <div class="widget">
    <p class="eyebrow">Fale com um agente</p>
    <div class="pills" role="radiogroup">
      <button class="pill" role="radio" aria-checked="true">PitchYes</button>
      <button class="pill" role="radio" aria-checked="false">Saúde</button>
      <button class="pill" role="radio" aria-checked="false">Seguros</button>
      <button class="pill" role="radio" aria-checked="false">Financeiro</button>
      <button class="pill" role="radio" aria-checked="false">Imobiliário</button>
    </div>
    <div class="stage">
      <button class="orb" aria-label="Falar com o agente"><span class="core"></span></button>
      <p class="name">Agente PitchYes</p>
      <p class="hint">Clique para falar com um agente</p>
    </div>
  </div>
</body>
</html>
