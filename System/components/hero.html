<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Hero — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; }
  .hero {
    padding: 64px var(--margin) 48px;
    display: grid;
    grid-template-columns: minmax(280px, 460px) 1fr;
    gap: var(--space-8);
    align-items: center;
  }
  .hero h1 { margin-bottom: var(--space-4); }
  .hero .accent { color: var(--color-accent-secondary-ink); }
  .hero p {
    font-size: 16px;
    color: var(--color-text-secondary);
    line-height: var(--body-lh);
    margin: 0 0 var(--space-5);
    max-width: 40ch;
  }
  .btn-solid {
    font-family: var(--font-sans);
    font-size: 14px; font-weight: 500;
    padding: 10px 16px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--color-accent-primary-contrast);
    background: var(--color-accent-primary);
    color: var(--color-accent-primary-contrast);
    text-decoration: none;
    display: inline-block;
  }
  .hero-meta { margin-top: var(--space-4); font-size: 13px; color: var(--color-text-muted); }
  .hero-meta strong { color: var(--color-text); }

  .hero-visual {
    position: relative;
    height: 320px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .hero-card {
    width: 220px;
    height: 260px;
    background: var(--color-bg-subtle);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-3);
    box-shadow: 0 24px 48px -16px rgba(21,21,21,.15);
  }
  .hero-orb {
    width: 72px; height: 72px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, var(--color-accent-primary), var(--color-accent-secondary));
    display: flex; align-items: center; justify-content: center;
    color: white;
  }
  .hero-card .tag { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; color: var(--color-text-muted); }
  .hero-card .title { font-size: 15px; font-weight: 600; }
  .hero-side {
    position: absolute;
    width: 140px; height: 220px;
    border-radius: var(--radius-lg);
    opacity: .5;
  }
  .hero-side.left { left: 0; background: linear-gradient(135deg,#f2a1c1,#54cfa8); }
  .hero-side.right { right: 0; background: linear-gradient(135deg,#c8e27a,#776eed); }

  .hint { text-align: center; margin-top: var(--space-3); font-size: 12px; color: var(--color-text-muted); }
</style>
</head>
<body>
  <section class="hero">
    <div>
      <h1>Voice AI for<br /><span class="accent">healthcare.</span></h1>
      <p>Built for high-stakes phone calls where security and trust actually matter.</p>
      <a class="btn-solid" href="#">Book a call</a>
      <div class="hero-meta"><strong>666.647.962</strong> calls resolved to date</div>
    </div>
    <div>
      <div class="hero-visual">
        <div class="hero-side left"></div>
        <div class="hero-card">
          <div class="hero-orb">▶</div>
          <div class="tag">Product</div>
          <div class="title">Ask anything</div>
        </div>
        <div class="hero-side right"></div>
      </div>
      <div class="hint">▸ Click to speak with an agent</div>
    </div>
  </section>
</body>
</html>
