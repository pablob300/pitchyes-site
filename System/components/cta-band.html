<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CTA band — Design System</title>
<link rel="stylesheet" href="../tokens/tokens.css" />
<style>
  body { margin: 0; padding: var(--space-8) var(--margin); }
  .note { font-size: 12px; color: var(--color-text-muted); margin: 0 0 var(--space-5); }
  .band { background: var(--color-pastel-peach); padding: 112px var(--space-6); display: flex; flex-direction: column; align-items: center; gap: var(--space-6); text-align: center; }
  .band h2 { font-size: 40px; line-height: 44px; letter-spacing: -.8px; max-width: 20ch; margin: 0; }
  .btn { font-family: var(--font-sans); font-size: 15px; font-weight: 500; padding: 12px 20px; border-radius: 8px; background: var(--color-text); color: #fff; text-decoration: none; }
</style>
</head>
<body>
  <p class="note">PitchYes · Faixa de CTA final sobre --color-pastel-peach, com botão escuro (btn-dark). React: FinalCta.tsx</p>
  <section class="band">
    <h2>IA de voz segura, que se paga sozinha.</h2>
    <a class="btn" href="#">Fale com nossa IA →</a>
  </section>
</body>
</html>
